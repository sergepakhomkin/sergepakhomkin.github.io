<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <title>Handyman & Electrical Services</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      text-align: center;
      background:
        linear-gradient(rgba(8, 22, 38, 0.88), rgba(8, 22, 38, 0.94)),
        linear-gradient(135deg, #173b5e, #071522);
    }

    .card {
      width: 100%;
      max-width: 680px;
      padding: 50px 35px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .icon {
      font-size: 54px;
      margin-bottom: 15px;
    }

   .website-address {
  margin-bottom: 14px;
  font-size: 24px;
  font-weight: 800;
  color: #ffffff;
}

.website-address strong {
  color: #ff5a00;
  font-size: 30px;
}

h1 {
  margin: 0;
  color: #ffffff;
  font-size: 64px;
  font-weight: 900;
  letter-spacing: 7px;
  line-height: 1;
  text-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
}

.services {
  display: inline-block;
  margin-top: 18px;
  padding-bottom: 12px;
  border-bottom: 4px solid #ff5a00;
  color: #ffffff;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1px;
}

    .coming-soon {
      margin: 35px 0 12px;
      font-size: 30px;
    }

    .message {
      margin: 0 auto 30px;
      max-width: 500px;
      font-size: 18px;
      line-height: 1.6;
      color: #d9e2ea;
    }

    .contact {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 10px;
      color: #071522;
      background: #f4c85a;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
    }

    .contact:hover {
      background: #ffd76d;
    }

    .note {
      margin-top: 18px;
      font-size: 14px;
      color: #bdc9d4;
    }

    @media (max-width: 600px) {
      .card {
        padding: 40px 22px;
      }

      h1 {
        font-size: 38px;
      }

      .coming-soon {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon">💡</div>


    <div class="website-address">
  <span>www.</span><strong>besthelps</strong><span>.com</span>
</div>

<h1> " " </h1>

<div class="services">
  HANDYMAN &amp; ELECTRICAL SERVICES
</div>

    <h2 class="coming-soon">Our website is coming soon</h2>

    <p class="message">
      We are currently building our new website.
      Please contact us by email for service requests and estimates.
    </p>

    <a class="contact" href="mailto:services@besthelps.com">
      services@besthelps.com
    </a>

    <div class="note">
      Email or text is preferred
    </div>
  </main>
</body>
</html>
